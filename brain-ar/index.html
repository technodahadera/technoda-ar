S.forEach((s,i)=>{const c=el("div",null,"printCard"),p=new Image();p.src=url(s);p.alt=s.name;c.append(el("h2","טכנודע • כרטיס "+(i+1)+" • "+s.name),p);$("printArea").append(c)});
async function loadImage(s){let img=new Image();img.src=url(s);await img.decode();return img}
async function targets(images,Compiler){let db;try{db=await new Promise((resolve,reject)=>{let req=indexedDB.open("technoda-brain-targets",1);req.onupgradeneeded=()=>req.result.createObjectStore("cache");req.onsuccess=()=>resolve(req.result);req.onerror=reject});let cached=await new Promise((res,rej)=>{let q=db.transaction("cache").objectStore("cache").get("v1");q.onsuccess=()=>res(q.result);q.onerror=rej});if(cached)return cached}catch{}let compiler=new Compiler();let canvases=images.map(img=>{let c=document.createElement("canvas");let k=Math.min(1,700/Math.max(img.naturalWidth,img.naturalHeight));c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);return c});await compiler.compileImageTargets(canvases,p=>{setLoading("מכין זיהוי תמונות: "+Math.round(p)+"%")});let data=compiler.exportData();try{db?.transaction("cache","readwrite").objectStore("cache").put(data,"v1")}catch{}return data}

async function stopAR(){session++;starting=false;const instance=ar;ar=null;try{instance?.renderer.setAnimationLoop(null);instance?.stop()}catch{}anchors=[];active=-1;scanSolved=false;$("camera").replaceChildren();for(const id of ["camera","overlay","camPanel","hint"])$(id).hidden=true;$("camPanel").replaceChildren()}
$("stop").onclick=async()=>{const solved=scanSolved;await stopAR();phase=solved?"review":"prepare";render()};window.addEventListener("pagehide",()=>{stopAR()});
async function startAR(){if(starting)return;starting=true;const n=++session;const start=$("start");if(start)start.disabled=true;setLoading("טוען את תמונות הדגם ומכין זיהוי. בפעם הראשונה זה עשוי להימשך זמן.");let objectURL;try{if(!navigator.mediaDevices?.getUserMedia)throw Error("נדרשת מצלמה ודפדפן מאובטח");const [{MindARThree},THREE,{Compiler}]=await Promise.all([import("mindar-image-three"),import("three"),import("../vendor/mind-ar@1.2.5/mindar-image.prod.js")]);imageCache=imageCache||await Promise.all(S.map(loadImage));compiled=compiled||await targets(imageCache,Compiler);if(n!==session)return;objectURL=URL.createObjectURL(new Blob([compiled]));$("camera").hidden=false;$("overlay").hidden=false;$("hint").hidden=false;$("status").textContent="אשרו גישה למצלמה";$("camPanel").hidden=true;ar=new MindARThree({container:$("camera"),imageTargetSrc:objectURL,uiLoading:"no",uiScanning:"no",uiError:"no",maxTrack:1});const instance=ar,{renderer,scene,camera}=instance;for(let i=0;i<S.length;i++){let img=imageCache[i],anchor=instance.addAnchor(i),tex=new THREE.CanvasTexture(labelCanvas(S[i],img.naturalWidth,img.naturalHeight));tex.colorSpace=THREE.SRGBColorSpace;let plane=new THREE.Mesh(new THREE.PlaneGeometry(1,img.naturalHeight/img.naturalWidth),new THREE.MeshBasicMaterial({map:tex,transparent:true,depthWrite:false,toneMapped:false}));plane.visible=false;anchor.group.add(plane);anchors.push({anchor,plane});anchor.onTargetFound=()=>{if(n!==session)return;if(i!==current){$("status").textContent="זהו כרטיס "+(i+1)+". חפשו כרטיס "+(current+1)+".";return}active=i;$("hint").hidden=true;$("status").textContent="כרטיס "+(i+1)+" זוהה!";if(!$("camPanel").firstChild){$("camPanel").hidden=false;question(i,$("camPanel"),false)}};anchor.onTargetLost=()=>{if(n===session&&active===i){active=-1;$("hint").hidden=false;$("status").textContent=scanSolved?"כוונו שוב לכרטיס כדי לראות את הסימונים":"אפשר לבצע את המשימה ולחזור לכרטיס";}}}await instance.start();if(n!==session){try{instance.stop()}catch{}return}renderer.setAnimationLoop(()=>renderer.render(scene,camera));if(active<0)$("status").textContent="סרקו רק את כרטיס "+(current+1);setLoading("");}catch(e){console.error(e);if(n===session){await stopAR();render();setLoading("המצלמה לא נפתחה. בדקו הרשאות או לחצו על המשך ללא סריקה.")}}finally{if(objectURL)URL.revokeObjectURL(objectURL);starting=false;if(start)start.disabled=false}}
render();
</script></body></html>
