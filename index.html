<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מציאות רבודה – טכנודע</title>
<meta name="description" content="אוסף פרויקטי מציאות רבודה של תוכנית המחוננים בטכנודע.">
<meta name="theme-color" content="#0f3d4a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --deep: #0f3d4a;
    --deep-2: #18586a;
    --teal: #1aa39a;
    --cream: #fff8ec;
    --paper: #f4efe4;
    --ink: #142f37;
    --muted: #3c5660;
    --card: #fffdf9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Rubik", system-ui, "Segoe UI", Arial, sans-serif;
    color: var(--ink);
    background: var(--paper);
    line-height: 1.5;
  }
  .hero {
    background:
      radial-gradient(820px 240px at 100% -20%, rgba(26, 163, 154, .45), transparent 60%),
      linear-gradient(160deg, var(--deep) 0%, var(--deep-2) 100%);
    color: var(--cream);
    padding: 28px 0 36px;
  }
  .wrap {
    width: min(1080px, calc(100% - 32px));
    margin-inline: auto;
  }
  .logo {
    width: min(240px, 72vw);
    height: auto;
    display: block;
    background: #fff;
    border-radius: 18px;
    padding: 10px 14px;
  }
  h1 {
    margin: 22px 0 8px;
    font-size: clamp(1.9rem, 5.2vw, 3.1rem);
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: -0.02em;
  }
  .hero p {
    margin: 0;
    max-width: 38rem;
    font-size: 1.125rem;
    line-height: 1.65;
    color: rgba(255, 248, 236, .9);
  }
  .stripe {
    height: 7px;
    background: linear-gradient(90deg, #5b4ddb, #d23b88, #f08a24, #7dbb3a, #1aa39a);
  }
  main { padding: 28px 0 12px; }
  .section-title {
    margin: 0 0 14px;
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--muted);
    text-align: center;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 380px));
    gap: 18px;
    justify-content: center;
  }
  .card {
    background: var(--card);
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 16px 36px rgba(15, 61, 74, .08);
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .card img {
    width: 100%;
    height: auto;
    aspect-ratio: 3 / 2;
    object-fit: cover;
    background: #e7eef0;
    display: block;
  }
  .card-body {
    padding: 16px 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
  }
  .card h2 {
    margin: 0;
    font-size: 1.28rem;
    line-height: 1.35;
    font-weight: 700;
  }
  .card p {
    margin: 0;
    color: var(--muted);
    line-height: 1.6;
    flex: 1;
  }
  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 8px;
  }
  .actions a {
    flex: 1 1 140px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 48px;
    padding: 10px 14px;
    border-radius: 999px;
    font-weight: 600;
    text-decoration: none;
    text-align: center;
    line-height: 1.2;
  }
  .actions a.primary {
    background: var(--deep);
    color: var(--cream);
  }
  .actions a.primary:hover { background: #1b6278; }
  .actions a.secondary {
    background: #fff;
    color: var(--deep);
    box-shadow: inset 0 0 0 2px rgba(15, 61, 74, .2);
  }
  .actions a.secondary:hover {
    box-shadow: inset 0 0 0 2px var(--teal);
    color: #0d6f69;
  }
  .actions a:focus-visible {
    outline: 3px solid var(--teal);
    outline-offset: 3px;
  }
  .note {
    margin: 18px 0 0;
    color: var(--muted);
    font-size: .98rem;
    text-align: center;
  }
  footer {
    padding: 8px 0 36px;
    color: var(--muted);
    font-size: .95rem;
    text-align: center;
  }
  @media (hover: hover) and (prefers-reduced-motion: no-preference) {
    .card { transition: transform .18s ease, box-shadow .18s ease; }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 22px 44px rgba(15, 61, 74, .12);
    }
  }
</style>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <img class="logo" src="assets/logo.png" width="360" height="117" alt="טכנודע – המוזיאון הישראלי לרפואה ומדע, חדרה">
    <h1>מציאות רבודה – טכנודע</h1>
    <p>פרויקטי מציאות רבודה של תוכנית המחוננים. מדפיסים את התמונה, מכוונים את המצלמה, והדף מתעורר לחיים.</p>
  </div>
</header>
<div class="stripe" role="presentation"></div>
<main class="wrap">
  <h2 class="section-title">הפרויקטים</h2>
  <div class="grid" id="projects"></div>
  <p class="note">עוד פרויקטים יצטרפו לכאן.</p>
</main>
<footer class="wrap">תוכנית המחוננים · טכנודע חדרה</footer>
<script>
// כדי להוסיף פרויקט: מוסיפים אובייקט למערך PROJECTS.
const PROJECTS = [
  {
    title: "תמונה חיה – בדיקת חדות ראייה",
    description: "מכוונים את המצלמה לתמונה המודפסת והיא מתעוררת לחיים",
    image: "eye-ar/assets/poster.jpg",
    imageAlt: "איור של ילדים ליד לוח בדיקת ראייה",
    width: 1080,
    height: 720,
    actions: [
      { label: "פתיחת ה-AR", href: "eye-ar/", primary: true },
      { label: "הדפסת התמונה", href: "eye-ar/print-target.pdf", newTab: true }
    ]
  }
];

const grid = document.getElementById("projects");

for (const project of PROJECTS) {
  const card = document.createElement("article");
  card.className = "card";

  const img = document.createElement("img");
  img.src = project.image;
  img.alt = project.imageAlt || "";
  if (project.width) img.width = project.width;
  if (project.height) img.height = project.height;

  const body = document.createElement("div");
  body.className = "card-body";

  const title = document.createElement("h2");
  title.textContent = project.title;

  const description = document.createElement("p");
  description.textContent = project.description;

  const actions = document.createElement("div");
  actions.className = "actions";

  for (const action of project.actions) {
    const link = document.createElement("a");
    link.href = action.href;
    link.textContent = action.label;
    link.className = action.primary ? "primary" : "secondary";
    if (action.newTab) {
      link.target = "_blank";
      link.rel = "noopener";
    }
    actions.append(link);
  }

  body.append(title, description, actions);
  card.append(img, body);
  grid.append(card);
}
</script>
</body>
</html>
